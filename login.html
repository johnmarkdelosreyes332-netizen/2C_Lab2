<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Sign in to your account.">
	<title>Welcome back | Blush</title>
	<style>
		:root {
			--ink: #35232a;
			--muted: #876d75;
			--rose: #d95f83;
			--rose-dark: #ba4168;
			--blush: #fff1f4;
			--line: #ead9de;
			--white: #fffdfd;
			--shadow: 0 24px 70px rgba(104, 49, 66, 0.14);
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background: #fbe3ea;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		.page {
			position: relative;
			display: grid;
			place-items: center;
			min-height: 100vh;
			overflow: hidden;
			padding: 32px 20px;
			background:
				radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.74) 0 14%, transparent 35%),
				linear-gradient(135deg, #f8d9e2 0%, #fff4f5 53%, #f6dce5 100%);
		}

		.page::before,
		.page::after {
			position: absolute;
			border: 1px solid rgba(255, 255, 255, 0.68);
			border-radius: 50%;
			content: "";
			pointer-events: none;
		}

		.page::before { width: 360px; height: 360px; top: -170px; right: -100px; }
		.page::after { width: 270px; height: 270px; bottom: -150px; left: -90px; }

		.shell {
			position: relative;
			z-index: 1;
			display: grid;
			grid-template-columns: 0.92fr 1.08fr;
			width: min(960px, 100%);
			min-height: 590px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.84);
			border-radius: 28px;
			background: rgba(255, 253, 253, 0.76);
			box-shadow: var(--shadow);
			backdrop-filter: blur(14px);
			animation: rise 0.7s ease-out both;
		}

		.welcome {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 48px;
			background: linear-gradient(150deg, #d96084 0%, #ed8ea6 100%);
			color: #fff9fa;
		}

		.mark { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.08em; }
		.mark-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: #fff8fa; color: var(--rose); font-size: 18px; }
		.welcome-copy { max-width: 290px; }
		.eyebrow { margin: 0 0 14px; color: #ffe6ec; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
		h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 400; line-height: 0.98; letter-spacing: -0.04em; }
		.welcome-copy p:last-child { margin: 22px 0 0; color: #ffe9ee; line-height: 1.7; }
		.quote { margin: 0; max-width: 260px; color: #fff1f4; font-family: Georgia, serif; font-size: 1.05rem; font-style: italic; line-height: 1.6; }
		.quote::before { display: block; margin-bottom: 10px; content: "\201C"; color: #ffc9d8; font-size: 2.8rem; line-height: 0.5; }

		.form-panel { display: flex; align-items: center; padding: 56px clamp(32px, 7vw, 80px); background: var(--white); }
		.form-wrap { width: 100%; max-width: 340px; margin: 0 auto; }
		.form-wrap h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 2.15rem; font-weight: 400; }
		.subheading { margin: 0 0 34px; color: var(--muted); font-size: 0.94rem; }
		.field { margin-bottom: 20px; }
		label { display: block; margin-bottom: 8px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.03em; }
		input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 14px 15px; outline: none; color: var(--ink); background: #fffafa; font: inherit; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
		input::placeholder { color: #b59ea5; }
		input:focus { border-color: var(--rose); background: #fff; box-shadow: 0 0 0 4px rgba(217, 95, 131, 0.12); }
		.password-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
		.password-row label { margin: 0; }
		.forgot { color: var(--rose-dark); font-size: 0.76rem; font-weight: 700; text-decoration: none; }
		.forgot:hover { text-decoration: underline; }
		.submit { width: 100%; margin-top: 7px; border: 0; border-radius: 10px; padding: 15px; cursor: pointer; color: white; background: var(--rose); font: inherit; font-weight: 700; box-shadow: 0 10px 20px rgba(217, 95, 131, 0.22); transition: transform 0.2s, background 0.2s, box-shadow 0.2s; }
		.submit:hover { background: var(--rose-dark); box-shadow: 0 12px 24px rgba(186, 65, 104, 0.25); transform: translateY(-2px); }
		.submit:active { transform: translateY(0); }
		.divider { display: flex; align-items: center; gap: 12px; margin: 28px 0 22px; color: #b59ea5; font-size: 0.74rem; }
		.divider::before, .divider::after { height: 1px; flex: 1; background: var(--line); content: ""; }
		.signup { margin: 0; color: var(--muted); text-align: center; font-size: 0.86rem; }
		.signup a { color: var(--rose-dark); font-weight: 700; text-decoration: none; }
		.signup a:hover { text-decoration: underline; }
		.status { min-height: 20px; margin: 12px 0 0; color: var(--rose-dark); font-size: 0.8rem; text-align: center; }

		@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

		@media (max-width: 700px) {
			.page { padding: 18px 14px; }
			.shell { display: block; min-height: auto; border-radius: 22px; }
			.welcome { min-height: 260px; padding: 28px 28px 30px; }
			.welcome-copy { max-width: 100%; margin-top: 32px; }
			.welcome-copy h1 { font-size: 2.5rem; }
			.welcome-copy p:last-child, .quote { display: none; }
			.form-panel { padding: 36px 28px 40px; }
		}

		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
	</style>
</head>
<body>
	<main class="page">
		<section class="shell" aria-label="Sign in">
			<aside class="welcome">
				<div class="mark"><span class="mark-icon" aria-hidden="true">✦</span> BLUSH</div>
				<div class="welcome-copy">
					<p class="eyebrow">A softer way to begin</p>
					<h1>Make room for good things.</h1>
					<p>Keep your little rituals, ideas, and everyday moments close.</p>
				</div>
				<p class="quote">Small steps still move you somewhere lovely.</p>
			</aside>

			<section class="form-panel">
				<div class="form-wrap">
					<h2>Welcome back</h2>
					<p class="subheading">Sign in to continue your journey.</p>
					<form id="login-form">
						<div class="field">
							<label for="email">Email address</label>
							<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
						</div>
						<div class="field">
							<div class="password-row">
								<label for="password">Password</label>
								<a class="forgot" href="#forgot">Forgot password?</a>
							</div>
							<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
						</div>
						<button class="submit" type="submit">Sign in</button>
						<p class="status" id="status" role="status" aria-live="polite"></p>
					</form>
					<div class="divider">or</div>
					<p class="signup">New here? <a href="#create-account">Create an account</a></p>
				</div>
			</section>
		</section>
	</main>
	<script>
		const form = document.querySelector('#login-form');
		const status = document.querySelector('#status');

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			status.textContent = 'Thanks, your sign-in details are ready.';
		});
	</script>
</body>
</html>
